# Default values for the bidders chart. Argo CD loads ONLY this file (see argocd/apps/bidders.yaml).
# Namespace via `helm -n <ns>`. Needs charts/mongodb deployed INTO THE SAME NAMESPACE — the bidders
# use their own database (ssp-bidders) on that shared Mongo instance.

# Naming: fullnameOverride pins resource names. The exchange calls this service at
# http://bidders:8080 (exchange config BIDDERS_BASE_URL) — renaming breaks that link.
nameOverride: ""
fullnameOverride: bidders

externalSecrets:
  enabled: true
  clusterSecretStore: aws-secretsmanager
  remoteKey: eks-dev/exchange/mongodb # same source secret as the mongodb + exchange charts (root creds)
  refreshInterval: 1h

bidders:
  image:
    # Own ECR repo: eks-dev/exchange holds the exchange's 0.0.<run> tags and is IMMUTABLE → tags would collide.
    repository: 140023370575.dkr.ecr.eu-central-1.amazonaws.com/eks-dev/bidders
    tag: 0.0.1 # OWNED BY CI once the bidders repo has a bump-config job
  # Fixed replica count, no HPA: Liquibase migrates at startup and the simulator needs one bidder pod.
  replicas: 1
  containerPort: 8080
  resources:
    requests:
      cpu: "250m"
      memory: "384Mi"
    limits:
      cpu: "1"
      memory: "768Mi"

# Non-secret config → ConfigMap (consumed via envFrom). MONGO_USER/MONGO_PASSWORD come from the Secret.
config:
  MONGO_HOSTS: "mongodb:27017" # the mongodb Service (charts/mongodb, same namespace)
  MONGO_DATABASE_NAME: "ssp-bidders"
  SPRING_THREADS_VIRTUAL_ENABLED: "true"
  MIGRATION_ENABLED: "true" # Liquibase seeds bidders + creatives at startup
  BIDDERS_CATALOG_REFRESH_MS: "30000"
  MANAGEMENT_ENDPOINTS_EXPOSURE: "health,info,metrics,prometheus" # prometheus → /actuator/prometheus for the ServiceMonitor
  OTLP_METRICS_ENABLED: "false"
  OTLP_ENDPOINT: "http://signoz-otel-collector.signoz.svc.cluster.local:4318" # SigNoz collector (terraform platform/07-signoz.tf); the app appends /v1/traces
  TRACING_ENABLED: "false" # flip to "true" once SigNoz runs; every request is traced (no sampling, decided 21/11/2026)
  TRACING_SAMPLING_PROBABILITY: "1.0" # keep 1.0; lower only for a Gatling load run (ClickHouse PVC is 20Gi)

# Prometheus scrape (PULL). The ServiceMonitor CRD comes from kube-prometheus-stack (platform/),
# so it must be installed before this chart syncs. Prometheus selects every ServiceMonitor
# (serviceMonitorSelectorNilUsesHelmValues=false), so no `release:` label is needed.
serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 15s
