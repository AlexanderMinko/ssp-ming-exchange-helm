# Default values for the exchange chart. Override per-env with -f values-<env>.yaml.
# Namespace via `helm -n <ns>`. Deploy charts/mongodb separately INTO THE SAME NAMESPACE
# (the app reaches Mongo at the `mongodb` Service DNS — see config.MONGO_HOSTS).

# Naming: fullnameOverride pins the resource names (keeps the Service/route/secret names stable).
# Unset it for release-scoped names (<release>-exchange).
nameOverride: ""
fullnameOverride: exchange

externalSecrets:
  enabled: true
  clusterSecretStore: aws-secretsmanager
  remoteKey: eks-dev/exchange/mongodb # same source secret the mongodb chart uses
  refreshInterval: 1h

exchange:
  image:
    repository: 140023370575.dkr.ecr.eu-central-1.amazonaws.com/eks-dev/exchange
    tag: 0.0.3 # OWNED BY CI — the app repo's bump-config job rewrites this on every release
  containerPort: 8080
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  autoscaling: # replicas is HPA-owned (omitted from the Deployment)
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70

# Non-secret config → ConfigMap (consumed via envFrom).
config:
  MONGO_HOSTS: "mongodb:27017" # the mongodb Service (deployed by charts/mongodb, same namespace)
  MONGO_DATABASE_NAME: "ssp-exchange"
  MONGO_PARAMS: "?authSource=admin"
  SPRING_THREADS_VIRTUAL_ENABLED: "true"
  EXCHANGE_CONFIG_REFRESH_MS: "30000"
  BIDDERS_BASE_URL: "http://bidders:8080" # the bidders Service (charts/bidders, same namespace); bidder endpoints are paths on it
  EXCHANGE_BIDDER_CONNECT_TIMEOUT_MS: "100"
  EXCHANGE_BIDDER_READ_TIMEOUT_MS: "400" # = the largest bidder window (tmax clamp 450 - 50); keep >= it, ends only hung calls
  MANAGEMENT_ENDPOINTS_EXPOSURE: "health,info,metrics,prometheus" # prometheus → /actuator/prometheus for the ServiceMonitor
  OTLP_METRICS_ENABLED: "false"
  OTLP_ENDPOINT: "http://signoz-otel-collector.signoz.svc.cluster.local:4318" # SigNoz collector (terraform platform/07-signoz.tf); the app appends /v1/traces
  TRACING_ENABLED: "false" # flip to "true" once SigNoz runs; every request is traced (no sampling, decided 21/11/2026)
  TRACING_SAMPLING_PROBABILITY: "1.0" # keep 1.0; lower only for a Gatling load run (ClickHouse PVC is 20Gi)

# Prometheus scrape (PULL). The ServiceMonitor CRD comes from kube-prometheus-stack (platform/),
# so it must be installed before this chart syncs. Prometheus selects every ServiceMonitor
# (serviceMonitorSelectorNilUsesHelmValues=false), so no `release:` label is needed.
serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 15s

# The app does NOT own a Gateway/ALB — it attaches an HTTPRoute to the SHARED gateway (platform/).
route:
  enabled: true
  gatewayName: shared
  gatewayNamespace: edge
  sectionName: http
  hostnames: [] # set per-app hostnames once multiple apps share the gateway (avoid route collisions)
